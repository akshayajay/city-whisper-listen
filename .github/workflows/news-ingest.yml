name: Collect Tamil Nadu news

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citypulse-news-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect and verify live news
        env:
          CITYPULSE_NEWS_TOKEN: ${{ secrets.CITYPULSE_NEWS_TOKEN }}
        run: node scripts/collect-news.mjs
